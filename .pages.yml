media:
  input: public/images/seminars
  output: /images/seminars

content:
  - name: seminars
    label: ゼミ紹介
    type: collection
    path: content/seminars
    format: yaml-frontmatter    # ← markdown等の形式を指定
    filename: "{slug}.md"       # ← extension/slugの代わりにfilenameでテンプレートを指定
    fields:
      - name: title
        label: ゼミ名
        type: string
      - name: icon
        label: ゼミアイコン
        type: image
        required: true
      - name: teacher
        label: 担当教員名
        type: string
        required: true
      - name: image
        label: ゼミ画像
        type: image
      - name: description
        label: 一言概要
        type: string
      - name: body
        label: 詳細内容
        type: rich-text
