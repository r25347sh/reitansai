<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reitansai CMS</title>
  <link rel="stylesheet" href="src/css/pages/admin.css">
</head>
<body class="cms-app">
  <!-- LOGIN -->
  <div id="view-login" class="view view-login">
    <div class="login-panel">
      <div class="login-brand">🌲 REITANSAI <span>CMS</span></div>
      <h1>教員ログイン</h1>
      <p class="muted">関係者専用ワークスペース</p>
      <label>ユーザーID<input id="uid" autocomplete="username"></label>
      <label>パスワード<input id="pw" type="password" autocomplete="current-password"></label>
      <button type="button" id="btn-login" class="btn primary">ログイン</button>
      <p id="login-msg" class="msg"></p>
    </div>
  </div>

  <!-- DASH -->
  <div id="view-dash" class="view view-dash hidden">
    <header class="app-bar">
      <a class="brand" href="index.html">🌲 REITANSAI</a>
      <div class="app-bar-right">
        <span id="dash-user" class="user-pill"></span>
        <button type="button" id="btn-logout" class="btn ghost">ログアウト</button>
      </div>
    </header>
    <main class="dash-main">
      <div class="dash-head">
        <h1>ページ一覧</h1>
        <p class="muted">編集するページを選んでください</p>
      </div>
      <div id="presence-board" class="presence-board hidden"></div>
      <div id="page-grid" class="page-grid"></div>
      <p id="dash-status" class="muted center"></p>
    </main>
  </div>

  <!-- EDITOR -->
  <div id="view-editor" class="view view-editor hidden">
    <header class="editor-bar">
      <button type="button" id="btn-back" class="btn ghost">←</button>
      <div class="editor-title-block">
        <div id="ed-title" class="ed-title">—</div>
        <div id="ed-path" class="ed-path mono"></div>
      </div>
      <div id="collab-pills" class="collab-pills"></div>
      <div class="bar-spacer"></div>
      <div class="seg" id="device-seg">
        <button type="button" data-device="desktop" class="seg-btn on">PC</button>
        <button type="button" data-device="tablet" class="seg-btn">Tab</button>
        <button type="button" data-device="mobile" class="seg-btn">SP</button>
      </div>
      <button type="button" id="btn-outline" class="btn ghost" title="枠線">枠</button>
      <button type="button" id="btn-undo" class="btn ghost" title="元に戻す (Ctrl+Z)">↶</button>
      <button type="button" id="btn-redo" class="btn ghost" title="やり直し (Ctrl+Shift+Z)">↷</button>
      <input id="commit-msg" class="commit" placeholder="変更メモ">
      <button type="button" id="btn-save" class="btn primary">保存</button>
    </header>

    <div class="editor-body">
      <aside class="rail" id="rail">
        <nav class="rail-tabs" id="rail-tabs">
          <button type="button" data-tab="style" class="rail-tab on">スタイル</button>
          <button type="button" data-tab="add" class="rail-tab">追加</button>
          <button type="button" data-tab="meta" class="rail-tab">メタ</button>
          <button type="button" data-tab="assets" class="rail-tab">素材</button>
          <button type="button" data-tab="theme" class="rail-tab">テーマ</button>
          <button type="button" data-tab="layout" class="rail-tab">配置</button>
          <button type="button" data-tab="vars" class="rail-tab">変数</button>
          <button type="button" data-tab="adv" class="rail-tab">上級</button>
        </nav>

        <div class="rail-panels">
          <section class="rail-panel" data-panel="style">
            <div id="sel-info" class="sel-info">未選択</div>
            <label>テキスト<textarea id="p-text" rows="3"></textarea></label>
            <div class="row2">
              <label>文字色<input type="color" id="p-color" value="#e8f0e8"></label>
              <label>背景<input type="color" id="p-bg" value="#0a1a12"></label>
            </div>
            <label>サイズ <span id="p-size-v">16</span>px
              <input type="range" id="p-size" min="10" max="96" value="16">
            </label>
            <label>太さ
              <select id="p-weight">
                <option value="">—</option>
                <option value="300">細</option><option value="400">並</option>
                <option value="600">中太</option><option value="700">太</option>
              </select>
            </label>
            <label>揃え
              <select id="p-align">
                <option value="">—</option>
                <option value="left">左</option><option value="center">中央</option><option value="right">右</option>
              </select>
            </label>
            <label>リンク<input id="p-href" placeholder="URL"></label>
            <div class="fmt">
              <button type="button" data-cmd="bold"><b>B</b></button>
              <button type="button" data-cmd="italic"><i>I</i></button>
              <button type="button" data-cmd="underline"><u>U</u></button>
              <button type="button" data-cmd="strikeThrough"><s>S</s></button>
              <button type="button" data-cmd="justifyLeft">左</button>
              <button type="button" data-cmd="justifyCenter">中</button>
              <button type="button" data-cmd="justifyRight">右</button>
              <button type="button" data-cmd="insertUnorderedList">•</button>
              <button type="button" data-cmd="insertOrderedList">1.</button>
            </div>
            <button type="button" id="btn-apply-style" class="btn primary block">適用</button>
          </section>

          <section class="rail-panel hidden" data-panel="add">
            <p class="hint">選択位置の近くに挿入（自動微調整あり）</p>
            <div class="add-grid">
              <button type="button" data-add="h2">見出し</button>
              <button type="button" data-add="p">段落</button>
              <button type="button" data-add="btn">ボタン</button>
              <button type="button" data-add="a">リンク</button>
              <button type="button" data-add="img">画像</button>
              <button type="button" data-add="box">ボックス</button>
              <button type="button" data-add="card">カード</button>
              <button type="button" data-add="ul">リスト</button>
              <button type="button" data-add="hr">区切り</button>
              <button type="button" data-add="spacer">余白</button>
              <button type="button" data-add="cols">2列</button>
              <button type="button" data-add="date">日付</button>
            </div>
          </section>

          <section class="rail-panel hidden" data-panel="meta">
            <label>title<input id="m-title"></label>
            <label>description<textarea id="m-desc" rows="3"></textarea></label>
            <label>author<input id="m-author"></label>
            <label>favicon<input id="m-icon"></label>
            <label>og:image<input id="m-og"></label>
            <label>robots
              <select id="m-robots">
                <option value="">—</option>
                <option value="index,follow">index,follow</option>
                <option value="noindex,nofollow">noindex,nofollow</option>
              </select>
            </label>
            <button type="button" id="btn-meta" class="btn primary block">メタ反映</button>
          </section>

          <section class="rail-panel hidden" data-panel="assets">
            <p class="hint" id="asset-dir">src/files/pages/…</p>
            <label>アップロード<input type="file" id="asset-file" accept="image/*"></label>
            <button type="button" id="btn-upload" class="btn primary block">アップロード</button>
            <p id="asset-msg" class="msg"></p>
            <div id="asset-list" class="asset-list"></div>
          </section>

          <section class="rail-panel hidden" data-panel="theme">
            <p class="hint">ページ全体の色を一括変更</p>
            <label>背景<input type="color" id="t-bg" value="#06140e"></label>
            <label>文字<input type="color" id="t-text" value="#e8f0e8"></label>
            <label>アクセント<input type="color" id="t-accent" value="#c9a227"></label>
            <label>カード<input type="color" id="t-card" value="#0c1c14"></label>
            <button type="button" id="btn-theme" class="btn primary block">テーマ適用</button>
            <button type="button" id="btn-theme-reset" class="btn ghost block">リセット</button>
            <label>追加CSS<textarea id="t-css" rows="7" placeholder="/* custom */"></textarea></label>
          </section>

          <section class="rail-panel hidden" data-panel="layout">
            <p class="hint">複数選択（Shift/Ctrl+クリック）向け</p>
            <button type="button" id="lay-group" class="btn ghost block">グループ化</button>
            <button type="button" id="lay-ungroup" class="btn ghost block">グループ解除</button>
            <button type="button" id="lay-row" class="btn ghost block">横並び均等</button>
            <button type="button" id="lay-col" class="btn ghost block">縦並び均等</button>
            <button type="button" id="lay-fit-w" class="btn ghost block">横幅にフィット</button>
            <button type="button" id="lay-region" class="btn primary block">範囲指定して自動配置</button>
            <p class="hint">範囲指定: キャンバス上をドラッグ → OK</p>
          </section>

          <section class="rail-panel hidden" data-panel="vars">
            <div class="chip-row">
              <button type="button" class="chip" data-var="{{date}}">日付</button>
              <button type="button" class="chip" data-var="{{year}}">年</button>
              <button type="button" class="chip" data-var="{{user}}">編集者</button>
            </div>
            <div id="var-list"></div>
            <label>名前<input id="v-key"></label>
            <label>値<input id="v-val"></label>
            <button type="button" id="btn-var-add" class="btn primary block">変数追加</button>
          </section>

          <section class="rail-panel hidden" data-panel="adv">
            <label>class<input id="a-class"></label>
            <label>id<input id="a-id"></label>
            <label>z-index<input id="a-z" type="number"></label>
            <label>HTML<textarea id="a-html" rows="8"></textarea></label>
            <button type="button" id="btn-adv" class="btn primary block">適用</button>
            <button type="button" id="btn-lock" class="btn ghost block">保護</button>
            <button type="button" id="btn-unlock" class="btn ghost block">保護解除</button>
          </section>
        </div>
      </aside>

      <div class="stage-wrap">
        <div id="stage" class="stage device-desktop">
          <iframe id="frame" title="preview" sandbox="allow-same-origin allow-scripts"></iframe>
          <div id="region-mask" class="region-mask hidden"></div>
        </div>
        <div id="status" class="status-bar">準備完了</div>
      </div>
    </div>
  </div>

  <!-- Context menu -->
  <div id="ctx" class="ctx hidden" role="menu">
    <button type="button" data-ctx="edit">テキスト編集</button>
    <button type="button" data-ctx="copy">コピー</button>
    <button type="button" data-ctx="cut">切り取り</button>
    <button type="button" data-ctx="paste">貼り付け</button>
    <button type="button" data-ctx="dup">複製</button>
    <button type="button" data-ctx="delete">削除</button>
    <hr>
    <button type="button" data-ctx="front">最前面へ</button>
    <button type="button" data-ctx="forward">前面へ</button>
    <button type="button" data-ctx="backward">背面へ</button>
    <button type="button" data-ctx="back">最背面へ</button>
    <hr>
    <button type="button" data-ctx="group">グループ化</button>
    <button type="button" data-ctx="lock">保護（管理者）</button>
  </div>

  <script src="src/js/admin.js"></script>
</body>
</html>
