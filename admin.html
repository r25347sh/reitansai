<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin CMS | 麗誕祭</title>
  <link rel="stylesheet" href="src/css/common.css">
  <link rel="stylesheet" href="src/css/pages/admin.css">
  <style>
    .hidden { display: none !important; }
    #auth-banner {
      display: none;
      margin: 0.75rem 1rem 0;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(201,162,39,0.45);
      background: rgba(201,162,39,0.12);
      color: #f0d060;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body class="admin-body">
  <div class="bg-fixed" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <header class="site-header">
    <a class="site-logo" href="index.html">🌲 REITANSAI <span>CMS</span></a>
  </header>
  <div id="auth-banner" role="status"></div>
  <main class="main admin-main">
    <section id="login-view" class="card admin-card">
      <h1 class="page-title" style="margin-top:0">教員ログイン</h1>
      <p class="page-sub">関係者専用</p>
      <!-- form の submit によるリロードを避けるため form を使わない -->
      <div id="login-box">
        <label>ユーザーID
          <input id="uid" name="uid" autocomplete="username" placeholder="r25347sh">
        </label>
        <label>パスワード
          <input id="pw" name="pw" type="password" autocomplete="current-password">
        </label>
        <button type="button" id="login-btn" class="btn-gold">ログイン</button>
      </div>
      <p id="login-status" class="status" style="margin-top:.75rem;color:#f0d060"></p>
      <p id="login-error" class="error" style="color:#ff8a8a"></p>
    </section>

    <section id="dash-view" class="card admin-card hidden" style="display:none">
      <h1 class="page-title" style="margin-top:0">ホームメニュー</h1>
      <p id="user-label" class="page-sub"></p>
      <p>編集可能なページを選んでください。</p>
      <ul id="perm-list" class="perm-list"></ul>
      <p style="margin:1rem 0"><a class="auth-btn auth-in" href="index.html">← サイトに戻る</a></p>
      <button type="button" id="logout-btn" class="btn-outline">ログアウト</button>
    </section>

    <section id="edit-view" class="admin-edit hidden" style="display:none">
      <div class="edit-toolbar-top">
        <button type="button" id="btn-back" class="btn-outline">← 戻る</button>
        <span id="edit-path" class="mono"></span>
        <span id="edit-status" class="status"></span>
      </div>
      <div class="card admin-card">
        <h2>メタ情報</h2>
        <label>title<input id="meta-title"></label>
        <label>description<input id="meta-desc"></label>
        <label>author<input id="meta-author"></label>
        <label>favicon URL<input id="meta-favicon"></label>
      </div>
      <div class="card admin-card">
        <h2>本文</h2>
        <div class="rte-toolbar">
          <button type="button" data-cmd="bold"><b>B</b></button>
          <button type="button" data-cmd="italic"><i>I</i></button>
          <button type="button" data-cmd="underline"><u>U</u></button>
          <button type="button" data-cmd="insertUnorderedList">•</button>
          <button type="button" data-cmd="createLink">リンク</button>
          <button type="button" data-cmd="insertImage">画像</button>
          <button type="button" data-cmd="insertTable">表</button>
          <button type="button" data-cmd="insertEmbed">埋込</button>
        </div>
        <div id="rich-editor" class="rich-editor article_by_teacher" contenteditable="true"></div>
      </div>
      <div class="card admin-card">
        <h2>ページ固有 CSS</h2>
        <p class="mono" id="css-path"></p>
        <textarea id="css-editor" rows="8"></textarea>
      </div>
      <div class="card admin-card save-bar">
        <label>コミットメッセージ<input id="commit-msg" placeholder="2026/08/28の変更"></label>
        <button type="button" id="btn-save" class="btn-gold">GitHub に保存</button>
      </div>
      <div id="edit-frame" hidden></div>
    </section>
  </main>
  <script src="src/js/admin.js"></script>
</body>
</html>
