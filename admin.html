<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="教員 CMS — 麗誕祭">
  <title>Admin CMS | 麗誕祭</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <link rel="stylesheet" href="src/css/common.css">
  <link rel="stylesheet" href="src/css/pages/admin.css">
</head>
<body class="admin-body">
  <div class="bg-fixed" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <header class="site-header">
    <a class="site-logo" href="index.html">🌲 REITANSAI <span>CMS</span></a>
  </header>
  <main class="main admin-main">
    <section id="login-view" class="card admin-card">
      <h1 class="page-title" style="margin-top:0">教員ログイン</h1>
      <p class="page-sub" style="margin-bottom:1rem">関係者専用 · 公開メニューには表示されません</p>
      <form id="login-form">
        <label>ユーザーID<input id="uid" name="uid" required autocomplete="username" placeholder="例: r25347sh"></label>
        <label>パスワード<input id="pw" name="pw" type="password" required autocomplete="current-password"></label>
        <button type="submit" class="btn-gold">ログイン</button>
      </form>
      <p id="login-status" class="status" style="margin-top:.75rem"></p>
      <p id="login-error" class="error"></p>
    </section>
    <section id="dash-view" class="card admin-card hidden">
      <h1 class="page-title" style="margin-top:0">ホームメニュー</h1>
      <p id="user-label" class="page-sub"></p>
      <p>編集可能なページを選んでください。</p>
      <ul id="perm-list" class="perm-list"></ul>
      <p style="margin:1rem 0 .5rem"><a class="auth-btn auth-in" href="index.html">← サイトに戻る</a></p>
      <button type="button" id="logout-btn" class="btn-outline">ログアウト</button>
    </section>
    <section id="edit-view" class="admin-edit hidden">
      <div class="edit-toolbar-top">
        <button type="button" id="btn-back" class="btn-outline">← 戻る</button>
        <span id="edit-path" class="mono"></span>
        <span id="edit-status" class="status"></span>
      </div>
      <div class="card admin-card">
        <h2>メタ情報</h2>
        <label>title<input id="meta-title"></label>
        <label>description<input id="meta-desc"></label>
        <label>author<input id="meta-author"></label>
        <label>favicon URL<input id="meta-favicon"></label>
      </div>
      <div class="card admin-card">
        <h2>本文（section.article_by_teacher）</h2>
        <div class="rte-toolbar">
          <button type="button" data-cmd="bold" title="太字"><b>B</b></button>
          <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
          <button type="button" data-cmd="underline" title="下線"><u>U</u></button>
          <button type="button" data-cmd="insertUnorderedList">• リスト</button>
          <button type="button" data-cmd="insertOrderedList">1. リスト</button>
          <button type="button" data-cmd="createLink">リンク</button>
          <button type="button" data-cmd="insertImage">画像</button>
          <button type="button" data-cmd="insertTable">表</button>
          <button type="button" data-cmd="insertEmbed">埋め込み</button>
          <button type="button" data-cmd="removeFormat">クリア</button>
        </div>
        <div id="rich-editor" class="rich-editor article_by_teacher" contenteditable="true"></div>
        <p class="hint">画像はコピペで貼り付け可能。</p>
      </div>
      <div class="card admin-card">
        <h2>ページ固有 CSS（common は変更不可）</h2>
        <p class="mono" id="css-path"></p>
        <textarea id="css-editor" rows="8" placeholder="例: #article-ai h2 { color: #f0d060; }"></textarea>
      </div>
      <div class="card admin-card save-bar">
        <label>コミットメッセージ（任意）
          <input id="commit-msg" placeholder="2026/08/28の変更">
        </label>
        <button type="button" id="btn-save" class="btn-gold">GitHub に保存・プッシュ</button>
      </div>
      <div id="edit-frame" hidden data-sha="" data-path="" data-css-sha="" data-css-path=""></div>
    </section>
  </main>
  <script src="src/js/admin.js"></script>
</body>
</html>
