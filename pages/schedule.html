<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="麗探祭 2026 発表タイムスケジュール。いま見られる発表の絞り込み・Myスケジュール保存。">
  <title>スケジュール | 麗探祭 2026</title>
  <link rel="icon" type="image/png" href="/reitansai/sources/favicon.png" sizes="32x32">
  <link rel="manifest" href="/reitansai/manifest.webmanifest">
  <meta name="theme-color" content="#0b0e14">
  <link rel="stylesheet" href="/reitansai/src/css/common.css">
  <link rel="stylesheet" href="/reitansai/src/css/pages/schedule.css">
  <link rel="stylesheet" href="/reitansai/MENU/MENU.css">
  <script src="/reitansai/src/js/theme-control.js"></script>
  <script src="/reitansai/src/js/time-theme.js" defer></script>
  <script src="/reitansai/src/js/schedule-id.js"></script>
  <script src="/reitansai/src/js/my-schedule-store.js"></script>
</head>
<body class="page-schedule">
  <header class="site-header">
    <a class="site-logo" href="/reitansai/index.html">
      <img src="/reitansai/sources/麗探祭ロゴ.png" alt="麗探祭" width="40" height="40">
      <span class="logo-text"><strong>麗探祭</strong><span>Reitaku Inquiry EXPO 2026</span></span>
    </a>
    <nav class="nav-desktop">
      <a href="/reitansai/index.html">ホーム</a>
      <a href="/reitansai/pages/schedule.html" class="is-active">スケジュール</a>
      <a href="/reitansai/pages/my/my_schedule.html">Myスケジュール</a>
      <a href="/reitansai/pages/venue.html">会場マップ</a>
      <a href="/reitansai/pages/seminars/index.html">ゼミ一覧</a>
      <a href="/reitansai/pages/about_This_Site.html">About</a>
      <a href="/reitansai/sitemap.html">サイトマップ</a>
    </nav>
  </header>
  <main class="main">
    <section class="hero hero-compact">
      <div class="hero-badge">TIMETABLE</div>
      <h1>発表タイムスケジュール</h1>
      <p class="lead">2026年10月3日（土） 発表枠 9:30〜11:30 · 「保存」で Myスケジュール に追加（この端末に保存）</p>
      <p id="live-status" class="live-status" role="status" aria-live="polite">JST —</p>
    </section>
    <section class="section sched-filters">
      <div class="filter-bar">
        <input type="search" id="q" placeholder="タイトル・発表者・ゼミ名で検索…" autocomplete="off" aria-label="キーワード検索">
        <select id="f-seminar" aria-label="ゼミで絞り込み"><option value="">すべてのゼミ</option></select>
        <select id="f-venue" aria-label="会場で絞り込み"><option value="">すべての会場</option></select>
        <select id="f-form" aria-label="形式で絞り込み"><option value="">すべての形式</option></select>
        <select id="f-time" aria-label="時間帯で絞り込み">
          <option value="">すべての時間</option>
          <option value="9">9時台</option>
          <option value="10">10時台</option>
          <option value="11">11時台</option>
        </select>
        <select id="f-live" aria-label="進行状況で絞り込み">
          <option value="">すべての進行状況</option>
          <option value="live">🔴 いま見られる（進行中）</option>
          <option value="soon">🟡 まもなく＋進行中（30分以内）</option>
          <option value="upcoming">これから（未終了）</option>
          <option value="past">終了済み</option>
        </select>
      </div>
      <p class="filter-meta"><span id="result-count">—</span> 件表示 · <a href="/reitansai/pages/my/my_schedule.html">Myスケジュールへ</a></p>
      <div id="sched-progress" class="sched-progress" role="status" aria-live="polite">
        <div class="sched-progress-track">
          <div id="sched-progress-bar" class="sched-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="width:0%"></div>
        </div>
        <p id="sched-progress-label" class="sched-progress-label">読み込み準備中…</p>
      </div>
    </section>
    <section class="section">
      <div class="table-wrap">
        <table class="sched-table">
          <thead>
            <tr>
              <th data-sort="no" scope="col">通しNo.</th>
              <th data-sort="t" scope="col">開始</th>
              <th data-sort="e" scope="col">終了</th>
              <th data-sort="s" scope="col">ゼミ</th>
              <th data-sort="title" scope="col">発表タイトル</th>
              <th data-sort="sp" scope="col">発表者</th>
              <th data-sort="form" scope="col">形式</th>
              <th data-sort="v" scope="col">会場</th>
              <th scope="col">保存</th>
            </tr>
          </thead>
          <tbody id="sched-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <p>© 2026 麗探祭 — Reitaku Inquiry EXPO / 麗澤高等学校</p>
    <p class="footer-credit">Site by 5G 佐藤 晴</p>
  </footer>
  <script src="/reitansai/MENU/MENU.js"></script>
  <script src="/reitansai/src/js/pages/schedule.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/reitansai/sw.js').catch(function () {});
    }
  </script>
</body>
</html>
