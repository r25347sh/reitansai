<rect x="80" y="80" width="140" height="100" fill="#0f3d2e" stroke="#c9a227" stroke-width="1.5" rx="6" data-loc="main-hall"/>

<rect x="280" y="100" width="120" height="80" fill="#0f3d2e" stroke="#c9a227" stroke-width="1.5" rx="6" data-loc="library"/>

<rect x="460" y="80" width="130" height="100" fill="#0f3d2e" stroke="#c9a227" stroke-width="1.5" rx="6" data-loc="lab"/>
<text x="525" y="135" text-anchor="middle" fill="#e8f0e8" font-size="12">実験棟</text>
<rect x="620" y="200" width="120" height="90" fill="#0f3d2e" stroke="#c9a227" stroke-width="1.5" rx="6" data-loc="festival"/>

<ellipse cx="400" cy="320" rx="80" ry="40" fill="#0d2a1a" stroke="#a67c00" stroke-width="1"/>
<text x="400" y="325" text-anchor="middle" fill="#c9a227" font-size="11">中央広場</text>
</svg>
<p id="map-info" class="map-info">建物をタップすると情報が表示されます。</p>
