<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>化学ゼミ｜麗探祭</title>
  <link rel="icon" type="image/svg+xml" href="../public/images/favicon.svg">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="seminar.css">
  <link rel="stylesheet" href="layouts-extra.css">
  <link rel="stylesheet" href="themes/chemistry.css">
  <link rel="stylesheet" href="../MENU/MENU.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="theme-chemistry layout-chemistry">
  <div class="chem-lab">
    <header class="page-header"><a href="../index.html" class="back-link">← 研究室を出る</a></header>
    <div class="chem-bench">
      <div class="chem-flask-area">
        <img id="seminar-icon" src="" alt="" style="display:none" class="chem-flask-img">
        <div class="chem-bubbles" id="chem-bubbles"></div>
      </div>
      <div class="chem-info">
        <h1 id="seminar-title">読み込み中...</h1>
        <p class="teacher-name">PI: <span id="seminar-teacher">-</span></p>
        <p id="seminar-description" class="lead-text"></p>
        <label class="chem-formula-label">実験メモ（分子式っぽく）</label>
        <input type="text" id="chem-formula" placeholder="e.g. H2O" autocomplete="off">
        <p id="chem-result" class="chem-result"></p>
      </div>
    </div>
    <div class="image-wrapper"><img id="seminar-image" src="" alt="" style="display:none"></div>
    <article id="seminar-body" class="content-body"></article>
    <div id="seminar-sections" class="content-sections"></div>
    <footer class="site-footer"><a href="../index.html">トップ</a></footer>
  </div>
  <script src="../js/seminar-loader.js"></script>
  <script src="../MENU/MENU.js"></script>
  <script src="js/chemistry.js"></script>
  <script>loadSeminar("化学ゼミ", "化学ゼミ");</script>
</body>
</html>
