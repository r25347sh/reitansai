<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>映像編集ゼミ｜麗探祭</title>
  <link rel="icon" type="image/svg+xml" href="../public/images/favicon.svg">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="seminar.css">
  <link rel="stylesheet" href="layouts-extra.css">
  <link rel="stylesheet" href="themes/video-editing.css">
  <link rel="stylesheet" href="../MENU/MENU.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="theme-video-editing layout-video-editing">
  <div class="vid-frame">
    <header class="vid-topbar">
      <a href="../index.html" class="back-link">← 一覧</a>
      <span class="vid-timecode" id="vid-timecode">00:00:00:00</span>
    </header>
    <div class="vid-monitor">
      <img id="seminar-icon" src="" alt="" style="display:none" class="vid-poster">
      <h1 id="seminar-title">読み込み中...</h1>
      <p class="teacher-name">DIR. <span id="seminar-teacher">-</span></p>
      <button type="button" class="vid-play" id="vid-play" aria-label="play">▶</button>
    </div>
    <div class="vid-timeline" id="vid-timeline">
      <div class="vid-track"><div class="vid-clip" style="left:8%;width:22%"></div><div class="vid-clip c2" style="left:35%;width:30%"></div><div class="vid-clip c3" style="left:70%;width:18%"></div></div>
      <div class="vid-playhead" id="vid-playhead"></div>
    </div>
    <p id="seminar-description" class="lead-text"></p>
    <div class="image-wrapper"><img id="seminar-image" src="" alt="" style="display:none"></div>
    <article id="seminar-body" class="content-body"></article>
    <div id="seminar-sections" class="content-sections"></div>
    <footer class="site-footer"><a href="../index.html">トップ</a></footer>
  </div>
  <script src="../js/seminar-loader.js"></script>
  <script src="../MENU/MENU.js"></script>
  <script src="js/video-editing.js"></script>
  <script>loadSeminar("映像編集ゼミ", "映像編集ゼミ");</script>
</body>
</html>
