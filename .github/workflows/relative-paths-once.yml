name: Convert paths to relative

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/relative-paths-once.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert absolute paths
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          ROOT = Path('.').resolve()
          text_exts = {'.html', '.css', '.js', '.json', '.webmanifest'}
          changed = []

          for dirpath, _, files in os.walk(ROOT):
              if '/.git' in dirpath or '/sources/' in (dirpath + '/'):
                  continue
              for name in files:
                  p = Path(dirpath) / name
                  if p.suffix.lower() not in text_exts:
                      continue
                  try:
                      text = p.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  if '/reitansai/' not in text:
                      continue
                  # depth of file under repo root
                  rel = p.relative_to(ROOT)
                  depth = len(rel.parts) - 1
                  prefix = '../' * depth if depth else ''
                  new = text.replace('/reitansai/', prefix)
                  if new != text:
                      p.write_text(new, encoding='utf-8')
                      changed.append(str(rel))

          print('Updated', len(changed), 'files')
          for c in changed:
              print(' ', c)
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'refactor: convert /reitansai/ absolute paths to relative'
            git push
          fi
